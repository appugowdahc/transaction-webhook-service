# Render blueprint. DATABASE_URL is set in the dashboard (Neon/Supabase/Render Postgres).
services:
  - type: web
    name: transaction-webhooks
    runtime: docker
    region: virginia   # same region as the Neon DB (us-east-1); cross-region adds ~1s per insert
    plan: free   # spins down after ~15 min idle; keep it warm with an external ping to / every 5 min
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
